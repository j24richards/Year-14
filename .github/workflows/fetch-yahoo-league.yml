name: Fetch league data from Yahoo

# Pulls standings, weekly scores, recent transactions and rosters from Yahoo
# Fantasy into data/yahoo-league.json. Same Yahoo app and secrets as the ADP
# refresh. Scheduled for the NFL season only.
#
# One-time setup: add a repository VARIABLE (not a secret) named
# YAHOO_LEAGUE_ID with the number from your Yahoo league URL. Not sure what it
# is? Run this workflow once with dry run checked and no league id -- the log
# lists your leagues and their ids.

on:
  schedule:
    # 09:00 UTC every Tuesday (after Monday night), September through January.
    - cron: "0 9 * 9-12,1 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without committing"
        type: boolean
        default: true
      league_id:
        description: "Yahoo league id (blank = use the YAHOO_LEAGUE_ID variable)"
        default: ""
      week:
        description: "Only fetch this week (blank = current and previous week)"
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Yahoo league data
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_ID: ${{ github.event.inputs.league_id || vars.YAHOO_LEAGUE_ID }}
          WEEK: ${{ github.event.inputs.week }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/fetch-yahoo-league.mjs

      - name: Commit if the data changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -z "$(git status --porcelain data/yahoo-league.json)" ]]; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo-league.json
          git commit -m "Update league data from Yahoo"
          git push
