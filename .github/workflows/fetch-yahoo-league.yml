name: Fetch league data from Yahoo

# Pulls standings, weekly scores, lineups, transactions (waivers and trades)
# and rosters from Yahoo Fantasy into data/yahoo-league.json. Same Yahoo app
# and secrets as the ADP refresh. NFL season only (September through January).
#
# When it runs (all times UTC, so they line up with US game windows):
#   - game days are handled by the separate "Live scores (game days)"
#     workflow, which checks every minute or so
#   - Tuesday 09:00, once Monday night is final
#   - daily at 12:00, to pick up waiver moves and trades
# A run only commits when something actually changed, so quiet stretches add
# nothing to the history.
#
# One-time setup: add a repository VARIABLE (not a secret) named
# YAHOO_LEAGUE_ID with the number from your Yahoo league URL. Not sure what it
# is? Run this workflow once with dry run checked and no league id -- the log
# lists your leagues and their ids.

on:
  schedule:
    - cron: "0 9 * 9-12,1 2"
    - cron: "0 12 * 9-12,1 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without committing"
        type: boolean
        default: true
      league_id:
        description: "Yahoo league id (blank = use the YAHOO_LEAGUE_ID variable)"
        default: ""
      week:
        description: "Only fetch this week (blank = current and previous week). Also accepts a range like 1-6."
        default: ""
      debug:
        description: "Print a trimmed sample of Yahoo's raw replies in the log"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs overlap: they would both try to commit the same file.
concurrency:
  group: yahoo-league-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Yahoo league data
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_ID: ${{ github.event.inputs.league_id || vars.YAHOO_LEAGUE_ID }}
          WEEK: ${{ github.event.inputs.week }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DEBUG_RAW: ${{ github.event.inputs.debug || 'false' }}
        run: node scripts/fetch-yahoo-league.mjs

      - name: Commit if the data changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo-league.json data/yahoo-lineups.json
          if [[ -f data/yahoo-freeagents.json ]]; then git add data/yahoo-freeagents.json; fi
          git commit -m "Update league data from Yahoo"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
