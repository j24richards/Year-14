name: Refresh alternate mock-draft rankings

# Pulls Fantasy Football Calculator's free ADP list into data/mock-rankings.json
# for the Mock Draft's ranking dropdown. Runs weekly (Monday 10:17 UTC) and on
# demand. A run only commits when the numbers changed.

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without committing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mock-rankings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch FFC ADP
        env:
          FFC_SCORING: "half-ppr"
          FFC_TEAMS: "10"
          FFC_YEAR: "2026"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/fetch-mock-rankings.mjs

      - name: Commit if the data changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mock-rankings.json
          git commit -m "Refresh alternate mock-draft rankings"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
