name: Weekly Firestore backup

on:
  schedule:
    - cron: "23 9 * * 1"   # Mondays, 09:23 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export Firestore data
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """Snapshot the site's Firestore document (site/leagueData) into backups/.

          Reads the public web apiKey and projectId from index.html, calls the Firestore
          REST API with the same HTTP referrer the site uses (the key is restricted to
          j24richards.github.io), converts Firestore's typed values to plain JSON, and
          writes:
            backups/latest.json                 - always the newest snapshot
            backups/leagueData-YYYY-MM-DD.json  - dated copy, only when the data changed
          Only the newest KEEP dated copies are kept.
          """
          import datetime
          import glob
          import json
          import os
          import re
          import sys
          import urllib.request

          KEEP = 26
          REFERER = "https://j24richards.github.io/"
          OUT_DIR = "backups"


          def convert(v):
              if "stringValue" in v:
                  return v["stringValue"]
              if "integerValue" in v:
                  return int(v["integerValue"])
              if "doubleValue" in v:
                  return v["doubleValue"]
              if "booleanValue" in v:
                  return v["booleanValue"]
              if "nullValue" in v:
                  return None
              if "timestampValue" in v:
                  return v["timestampValue"]
              if "geoPointValue" in v:
                  return v["geoPointValue"]
              if "referenceValue" in v:
                  return v["referenceValue"]
              if "bytesValue" in v:
                  return v["bytesValue"]
              if "arrayValue" in v:
                  return [convert(x) for x in v["arrayValue"].get("values", [])]
              if "mapValue" in v:
                  return {k: convert(x) for k, x in v["mapValue"].get("fields", {}).items()}
              raise ValueError("unknown Firestore value: %r" % (list(v.keys()),))


          # Never write credentials into a public repo, even if they were
          # stored in the document by mistake.
          SENSITIVE = re.compile(r"password|passwd|secret|token|private[_-]?key", re.I)


          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if not SENSITIVE.search(k)}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value


          def convert_document(doc):
              return scrub({k: convert(v) for k, v in doc.get("fields", {}).items()})


          def main():
              html = open("index.html", encoding="utf-8").read()
              key = re.search(r'apiKey:\s*"([^"]+)"', html).group(1)
              project = re.search(r'projectId:\s*"([^"]+)"', html).group(1)
              url = ("https://firestore.googleapis.com/v1/projects/%s/databases/(default)"
                     "/documents/site/leagueData?key=%s" % (project, key))
              req = urllib.request.Request(url, headers={"Referer": REFERER})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  doc = json.load(resp)
              data = convert_document(doc)
              if not data:
                  sys.exit("Firestore returned an empty document; refusing to overwrite backups")
              text = json.dumps(data, indent=1, sort_keys=True, ensure_ascii=False) + "\n"

              os.makedirs(OUT_DIR, exist_ok=True)
              latest = os.path.join(OUT_DIR, "latest.json")
              previous = open(latest, encoding="utf-8").read() if os.path.exists(latest) else None
              if previous == text:
                  print("No change since last backup.")
                  return
              open(latest, "w", encoding="utf-8").write(text)
              stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
              dated = os.path.join(OUT_DIR, "leagueData-%s.json" % stamp)
              open(dated, "w", encoding="utf-8").write(text)
              print("Wrote", latest, "and", dated, "(%d bytes)" % len(text))

              for old in sorted(glob.glob(os.path.join(OUT_DIR, "leagueData-*.json")))[:-KEEP]:
                  os.remove(old)
                  print("Pruned", old)


          if __name__ == "__main__":
              main()

          PYEOF

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backups
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Weekly Firestore backup"
            git push
          fi
